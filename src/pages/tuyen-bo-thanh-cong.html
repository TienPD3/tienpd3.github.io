<style>
  .karaoke-studio {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    user-select: none;
    font-family: 'Roboto', sans-serif;
  }

  /* Header & Themes */
  .karaoke-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    border-bottom: 2px dashed #d4c4a8;
    margin-bottom: 15px;
  }

  .karaoke-title {
    color: #b58900;
    font-size: 1.45em;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }



  /* Control Dock */
  .control-dock {
    background: linear-gradient(135deg, rgba(254, 252, 245, 0.98) 0%, rgba(238, 232, 213, 0.98) 100%);
    border: 2px solid #d4c4a8;
    border-radius: 12px;
    padding: 14px 18px;
    box-shadow: 0 4px 15px rgba(181, 137, 0, 0.1);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }

  .dock-left, .dock-center, .dock-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .action-btn {
    background-color: #b58900;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.92em;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(181, 137, 0, 0.2);
  }

  .action-btn:hover {
    background-color: #936f00;
    transform: translateY(-1px);
  }

  .action-btn.secondary {
    background-color: #eee8d5;
    color: #5d4037;
    border: 1px solid #cbbfa8;
    box-shadow: none;
  }

  .action-btn.secondary:hover {
    background-color: #dfd6be;
    color: #3e2723;
  }

  .action-btn.play-btn {
    background-color: #b58900;
  }

  .action-btn.play-btn.active {
    background-color: #d9534f !important;
  }

  .select-styled {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #cbbfa8;
    background: #fdf6e3;
    color: #5d4037;
    font-size: 0.88em;
    outline: none;
    cursor: pointer;
  }

  /* KHUNG NÚT BẤM TĂNG / GIẢM TỐC ĐỘ (+) (-) TÙY THÍCH */
  .speed-stepper-box {
    display: flex;
    align-items: center;
    background: #fdf6e3;
    border: 1.5px solid #b58900;
    border-radius: 8px;
    padding: 3px 6px;
    gap: 4px;
  }

  .step-btn {
    background: #eee8d5;
    color: #5d4037;
    border: 1px solid #cbbfa8;
    width: 34px;
    height: 34px;
    border-radius: 6px;
    font-size: 1.15em;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .step-btn:hover {
    background: #b58900;
    color: white;
    border-color: #b58900;
  }

  .step-btn:active {
    transform: scale(0.95);
  }

  .speed-display-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 8px;
    min-width: 72px;
  }

  .speed-num-label {
    font-size: 1.05em;
    font-weight: 800;
    color: #b58900;
  }

  .speed-sub-label {
    font-size: 0.68em;
    color: #8c6d46;
    text-transform: uppercase;
    font-weight: 600;
  }



  .sound-wave {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
  }

  .sound-wave span {
    width: 2.5px;
    background-color: #b58900;
    border-radius: 1px;
    height: 3px;
  }

  .sound-wave.active span:nth-child(1) { animation: waveAnim 0.7s infinite ease-in-out; }
  .sound-wave.active span:nth-child(2) { animation: waveAnim 0.7s infinite ease-in-out 0.2s; }
  .sound-wave.active span:nth-child(3) { animation: waveAnim 0.7s infinite ease-in-out 0.4s; }
  .sound-wave.active span:nth-child(4) { animation: waveAnim 0.7s infinite ease-in-out 0.1s; }

  @keyframes waveAnim {
    0%, 100% { height: 3px; }
    50% { height: 12px; }
  }

  /* ========================================================
     KARAOKE SCREEN 2 DÒNG LIỀN MẠCH - 120 FPS
     ======================================================== */
  .karaoke-screen {
    background: linear-gradient(145deg, #2b1f14 0%, #15100c 100%);
    border: 3px solid #b58900;
    border-radius: 16px;
    padding: 30px 25px;
    margin-bottom: 25px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 0 40px rgba(181, 137, 0, 0.15);
    text-align: center;
    position: relative;
    overflow: hidden;
    will-change: transform;
    transform: translateZ(0);
    min-height: 330px;
    height: auto;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .karaoke-screen::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  }

  .karaoke-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #e0d0b0;
    font-size: 0.9em;
    font-weight: 500;
    height: 28px;
    flex-shrink: 0;
  }

  .karaoke-badge {
    background: rgba(181, 137, 0, 0.3);
    border: 1px solid #b58900;
    padding: 4px 14px;
    border-radius: 20px;
    color: #ffd54f;
    font-size: 0.9em;
    font-weight: 700;
  }

  .karaoke-dual-stage {
    display: flex;
    flex-direction: column;
    gap: 12px;
    justify-content: center;
    align-items: center;
    width: 100%;
    flex-grow: 1;
    min-height: 190px;
    height: auto;
    box-sizing: border-box;
  }

  /* Khung hiển thị câu đang đọc */
  .karaoke-reading-row {
    width: 100%;
    min-height: 110px;
    height: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Chữ to rõ ràng cố định 1 size duy nhất (1.95em) */
  .karaoke-dual-line {
    font-family: 'Playfair Display', serif;
    font-size: 1.95em;
    font-weight: 700;
    line-height: 1.42;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px 12px;
    padding: 0 16px;
    color: #fff8e7;
    will-change: transform;
    transform: translateZ(0);
    max-width: 100%;
  }

  /* Dòng kế tiếp */
  .karaoke-upcoming-row {
    width: 100%;
    min-height: 45px;
    height: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 1px dashed rgba(212, 196, 168, 0.25);
    padding-top: 8px;
    flex-shrink: 0;
    box-sizing: border-box;
  }

  .karaoke-upcoming-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.35em;
    color: rgba(212, 196, 168, 0.45);
    font-style: italic;
    letter-spacing: 0.3px;
    text-align: center;
    line-height: 1.35;
    max-width: 95%;
  }

  .karaoke-word {
    display: inline-block;
    position: relative;
    padding: 2px 4px;
    border-radius: 4px;
    color: #8c7b6d;
    transition: color 0.1s ease, text-shadow 0.1s ease;
  }

  .karaoke-word.read-done {
    color: #ffd54f;
    text-shadow: 0 0 10px rgba(255, 213, 79, 0.7);
  }

  .karaoke-word.singing {
    color: #ffffff;
    font-weight: 800;
    text-shadow: 0 0 12px #00e676, 0 0 24px #00e676;
  }



  .sentence-progress-bar {
    width: 100%;
    height: 5px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 3px;
    margin-top: 15px;
    overflow: hidden;
  }

  .sentence-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffc107, #00e676);
    box-shadow: 0 0 10px #00e676;
    will-change: width;
  }



  /* Zen Dark Theme */
  .karaoke-studio.dark-zen .control-dock {
    background: linear-gradient(135deg, #182026 0%, #202b33 100%);
    border-color: #394b59;
  }
  .karaoke-studio.dark-zen .speed-stepper-box {
    background: #182026;
    border-color: #d99b26;
  }
  .karaoke-studio.dark-zen .step-btn {
    background: #202b33;
    color: #f5f8fa;
    border-color: #394b59;
  }

  .karaoke-studio.dark-zen .action-btn.secondary {
    background: #293742;
    color: #d8e1e8;
    border-color: #394b59;
  }
  .karaoke-studio.dark-zen .select-styled {
    background: #182026;
    color: #f5f8fa;
    border-color: #394b59;
  }


  /* Touch Optimization cho iPhone / iPad */
  .action-btn, .step-btn, .select-styled {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* Tối ưu giao diện cho Điện Thoại (iPhone, Android - màn hình <= 600px) */
  @media (max-width: 600px) {
    .karaoke-studio {
      padding: 0 2px;
    }
    .karaoke-title {
      font-size: 1.15em;
      justify-content: center;
      text-align: center;
    }
    .control-dock {
      padding: 10px 8px;
      gap: 10px 6px;
      justify-content: center;
    }
    .dock-left {
      order: 1;
      justify-content: center;
    }
    .dock-center {
      order: 2;
      justify-content: center;
    }
    .dock-right {
      order: 3;
      width: 100%;
      justify-content: center;
      gap: 6px;
    }
    .select-styled {
      max-width: calc(100% - 25px);
      width: 100%;
      font-size: 0.82em;
      padding: 7px 8px;
      text-overflow: ellipsis;
    }
    .action-btn {
      padding: 8px 12px;
      font-size: 0.82em;
    }
    .speed-stepper-box {
      padding: 2px 4px;
    }
    .step-btn {
      width: 32px;
      height: 32px;
      font-size: 1.1em;
    }
    .speed-display-wrap {
      min-width: 62px;
      padding: 0 4px;
    }
    .speed-num-label {
      font-size: 0.95em;
    }
    .speed-sub-label {
      font-size: 0.62em;
    }
    .karaoke-screen {
      padding: 16px 10px;
      min-height: 280px;
      border-radius: 12px;
    }
    .karaoke-dual-stage {
      min-height: 170px;
      gap: 8px;
    }
    .karaoke-reading-row {
      min-height: 95px;
      padding: 4px 0;
    }
    .karaoke-upcoming-row {
      min-height: 40px;
      padding: 4px 0;
    }
    .karaoke-dual-line {
      font-size: 1.25em;
      line-height: 1.38;
      gap: 6px 8px;
      padding: 0 6px;
    }
    .karaoke-upcoming-text {
      font-size: 1.0em;
      line-height: 1.35;
    }
  }

  /* Tối ưu giao diện cho Máy Tính Bảng (iPad Mini, iPad Air, iPad Pro 768px - 1024px) */
  @media (min-width: 601px) and (max-width: 1024px) {
    .karaoke-dual-line {
      font-size: 1.65em;
      line-height: 1.4;
    }
    .karaoke-upcoming-text {
      font-size: 1.2em;
    }
    .karaoke-screen {
      min-height: 320px;
      padding: 24px 20px;
    }
    .karaoke-dual-stage {
      min-height: 190px;
    }
    .karaoke-reading-row {
      min-height: 110px;
    }
    .control-dock {
      padding: 12px 14px;
      gap: 10px;
    }
  }
</style>

<script>
  (function () {

      "Tôi giúp cho khách hàng của tôi có cuộc sống tốt đẹp hơn",

      "Tôi kiếm đủ thu nhập thụ động để chi trả cho phong cách sống của tôi mơ ước.",
      "Tôi chọn tự do về phương diện tài chính",
      "Tôi làm việc bởi vì tôi lựa chọn nó chứ không phải bởi vì tôi phải làm.",
      "Công việc kinh doanh bán thời gian của tôi là quản lý và đầu tư tiền và tạo ra dòng thu nhập thụ động.",
      "Tôi tạo lập cuộc sống của mình.",

      "Mọi mong muốn mọi nhu cầu mọi mục tiêu của tôi được đáp ứng ngay lập tức bởi trí tuệ vô hạn.",
      "Vũ trụ biết điều gì là tốt nhất dành cho tôi",
      "Mỗi ngày, về mọi mặt, tôi đang trở nên tốt hơn và tốt hơn",
      "Tôi kêu gọi sức mạnh nội tại",
      "Tôi đánh thức con người vĩ đại của bản thân",
      "Với niềm tin vĩ đại TÔI LÀ NGƯỜI VĨ ĐẠI."
    ];

    const AUDIO_TRACKS = {
      meditation: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=meditation-impromptu-01-122513.mp3",
      epic: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=cinematic-time-lapse-115672.mp3",
      rain: "https://cdn.pixabay.com/download/audio/2021/09/06/audio_73229be4d0.mp3?filename=soft-rain-ambient-111154.mp3"
    };

    // State & Lưu tốc độ đọc theo từng từ (millisecond / từ)
    const SAVED_MS_PER_WORD = localStorage.getItem("karaoke_ms_per_word");
    let msPerWord = 450;
    if (SAVED_MS_PER_WORD) {
      const parsed = parseInt(SAVED_MS_PER_WORD, 10);
      if (!isNaN(parsed) && parsed >= 10 && parsed <= 5000) {
        msPerWord = parsed;
      }
    } else {
      const oldSpeed = localStorage.getItem("karaoke_word_speed");
      if (oldSpeed) {
        const parsedSec = parseFloat(oldSpeed);
        if (!isNaN(parsedSec) && parsedSec >= 0.15 && parsedSec <= 3.0) {
          msPerWord = Math.round(parsedSec * 1000);
        }
      }
    }
    const PAUSE_END_SENTENCE = 400; // 400ms nghỉ đệm cuối mỗi câu

    let currentIndex = 0;
    let isPlaying = false;
    let currentLineDuration = 0;
    let animFrameId = null;
    let lineStartTime = 0;
    let elapsedTimer = null;
    let totalSeconds = 0;

    // Web Audio Synthesizer
    let audioCtx = null;
    let isSynthRunning = false;
    let synthTimer = null;
    let audioElem = null;

    // Elements
    const studio = document.getElementById("karaokeStudio");
    const btnPlay = document.getElementById("btnPlayKaraoke");
    const playIcon = document.getElementById("playIcon");
    const playLabel = document.getElementById("playLabel");
    const btnRestart = document.getElementById("btnRestart");
    const musicSelect = document.getElementById("dockMusicSelect");
    const soundWave = document.getElementById("dockSoundWave");
    const btnSpeedDown = document.getElementById("btnSpeedDown");
    const btnSpeedUp = document.getElementById("btnSpeedUp");
    const speedNumLabel = document.getElementById("speedNumLabel");
    const screenBadge = document.getElementById("screenBadge");
    const screenTimer = document.getElementById("screenTimer");
    const readingLine = document.getElementById("karaokeReadingLine");
    const upcomingText = document.getElementById("karaokeUpcomingText");
    const progressFill = document.getElementById("sentenceProgressFill");

    // Khởi tạo hiển thị tốc độ
    function updateSpeedDisplay() {
      speedNumLabel.textContent = `${msPerWord}ms`;
      localStorage.setItem("karaoke_ms_per_word", msPerWord.toString());
    }
    updateSpeedDisplay();

    // Audio Engine (Tương thích Safari trên iPhone & iPad)
    function initAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    // Tự động mở khoá AudioContext ngay từ cú chạm đầu tiên trên màn hình iPhone/iPad
    function unlockIOSAudio() {
      initAudioContext();
      window.removeEventListener("touchstart", unlockIOSAudio);
      window.removeEventListener("touchend", unlockIOSAudio);
      window.removeEventListener("click", unlockIOSAudio);
    }
    window.addEventListener("touchstart", unlockIOSAudio, { passive: true });
    window.addEventListener("touchend", unlockIOSAudio, { passive: true });
    window.addEventListener("click", unlockIOSAudio, { passive: true });

    function playSynthChord(notes, duration = 4.2, type = "peace") {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.01, now);
      masterGain.gain.linearRampToValueAtTime(0.09, now + 1.2);
      masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      masterGain.connect(audioCtx.destination);

      notes.forEach((freq) => {
        const osc = audioCtx.createOscillator();
        osc.type = type === "peace" ? "sine" : "triangle";
        osc.frequency.setValueAtTime(freq, now);
        osc.connect(masterGain);
        osc.start(now);
        osc.stop(now + duration);
      });
    }

    function startSynth(mode) {
      initAudioContext();
      isSynthRunning = true;
      const peaceChords = [
        [216, 270, 324, 432],
        [240, 288, 360, 480],
        [192, 240, 288, 384],
        [264, 330, 396, 528]
      ];
      const energyChords = [
        [220, 277.18, 329.63, 440],
        [261.63, 329.63, 392.00, 523.25],
        [174.61, 220, 261.63, 349.23],
        [196.00, 246.94, 293.66, 392.00]
      ];
      const chords = mode === "synth_peace" ? peaceChords : energyChords;

      let step = 0;
      function loop() {
        if (!isSynthRunning) return;
        playSynthChord(chords[step % chords.length], 4.2, mode === "synth_peace" ? "peace" : "energy");
        step++;
        synthTimer = setTimeout(loop, 4000);
      }
      loop();
    }

    function stopSynth() {
      isSynthRunning = false;
      if (synthTimer) {
        clearTimeout(synthTimer);
        synthTimer = null;
      }
    }

    function startBackgroundAudio() {
      const mode = musicSelect.value;
      soundWave.classList.add("active");

      if (mode.startsWith("synth_")) {
        if (audioElem) audioElem.pause();
        startSynth(mode);
      } else {
        stopSynth();
        const url = AUDIO_TRACKS[mode];
        if (!audioElem) {
          audioElem = new Audio();
          audioElem.loop = true;
          audioElem.playsInline = true;
          audioElem.setAttribute('playsinline', '');
          audioElem.setAttribute('webkit-playsinline', '');
          audioElem.addEventListener('ended', function() {
            this.currentTime = 0;
            this.play();
          });
        }
        audioElem.src = url;
        audioElem.loop = true;
        audioElem.volume = 0.65;
        audioElem.play().catch(() => {
          startSynth("synth_peace");
        });
      }
    }

    function stopBackgroundAudio() {
      soundWave.classList.remove("active");
      if (audioElem) audioElem.pause();
      stopSynth();
    }

    // TÍNH THỜI GIAN THEO TỐC ĐỘ ĐỒNG NHẤT CHO MỖI TỪ (ms/từ)
    function calculateDurationForSentence(text) {
      if (!text) return 500;
      const wordCount = text.trim().split(/\s+/).filter(Boolean).length;
      const pause = Math.min(PAUSE_END_SENTENCE, msPerWord * 2);
      return Math.max(50, wordCount * msPerWord + pause);
    }

    function populateWordsToLine(lineElem, text) {
      lineElem.innerHTML = "";
      const words = text.trim().split(/\s+/).filter(Boolean);
      words.forEach((w, idx) => {
        const span = document.createElement("span");
        span.className = "karaoke-word";
        span.textContent = w;
        span.dataset.wordIndex = idx;
        lineElem.appendChild(span);
      });
    }

    function changeLine(idx) {
      if (idx < 0 || idx >= AFFIRMATIONS.length) return;
      currentIndex = idx;
      lineStartTime = performance.now();
      currentLineDuration = calculateDurationForSentence(AFFIRMATIONS[idx]);

      screenBadge.textContent = `CÂU ${idx + 1} / ${AFFIRMATIONS.length}`;

      // Đưa câu hiện tại vào đúng dòng đọc duy nhất (cố định trung tâm)
      populateWordsToLine(readingLine, AFFIRMATIONS[idx]);

      // Hiển thị trước câu tiếp theo ở dòng phụ bên dưới
      if (idx < AFFIRMATIONS.length - 1) {
        upcomingText.textContent = AFFIRMATIONS[idx + 1];
      } else {
        upcomingText.innerHTML = `<span style='color:#ffd54f;'>★ Bạn đã hoàn thành trọn vẹn ${AFFIRMATIONS.length} câu tuyên bố thành công!</span>`;
      }

      progressFill.style.width = "0%";
    }

    function smoothAdvanceToNextLine() {
      if (currentIndex < AFFIRMATIONS.length - 1) {
        changeLine(currentIndex + 1);
      } else {
        screenBadge.textContent = "🎉 HOÀN THÀNH!";
        pauseKaraoke();
      }
    }

    // 120 FPS LOOP - MỖI TỪ CHẠY ĐÚNG THỜI LƯỢNG msPerWord
    function continuousKaraokeLoop(timestamp) {
      if (!isPlaying) return;

      const elapsed = timestamp - lineStartTime;
      const progress = Math.min(elapsed / currentLineDuration, 1);

      progressFill.style.width = (progress * 100).toFixed(2) + "%";

      const spans = readingLine.querySelectorAll(".karaoke-word");
      const totalWords = spans.length;

      if (totalWords > 0) {
        const wordDuration = msPerWord;
        const activeWordIndex = Math.floor(elapsed / wordDuration);

        for (let i = 0; i < totalWords; i++) {
          const span = spans[i];
          if (i < activeWordIndex) {
            if (span.className !== "karaoke-word read-done") {
              span.className = "karaoke-word read-done";
            }
          } else if (i === activeWordIndex) {
            if (span.className !== "karaoke-word singing") {
              span.className = "karaoke-word singing";
            }
          } else {
            if (span.className !== "karaoke-word") {
              span.className = "karaoke-word";
            }
          }
        }
      }

      if (elapsed >= currentLineDuration) {
        smoothAdvanceToNextLine();
      }

      animFrameId = window.requestAnimationFrame(continuousKaraokeLoop);
    }

    function startKaraoke() {
      isPlaying = true;
      btnPlay.classList.add("active");
      playIcon.className = "bi bi-pause-fill";
      playLabel.textContent = "Tạm Dừng";

      startBackgroundAudio();
      lineStartTime = performance.now();
      currentLineDuration = calculateDurationForSentence(AFFIRMATIONS[currentIndex]);
      animFrameId = window.requestAnimationFrame(continuousKaraokeLoop);

      if (!elapsedTimer) {
        elapsedTimer = setInterval(() => {
          totalSeconds++;
          const m = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
          const s = String(totalSeconds % 60).padStart(2, "0");
          screenTimer.textContent = `${m}:${s}`;
        }, 1000);
      }
    }

    function pauseKaraoke() {
      isPlaying = false;
      btnPlay.classList.remove("active");
      playIcon.className = "bi bi-play-fill";
      playLabel.textContent = "Bắt Đầu Đọc";

      if (animFrameId) {
        window.cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      stopBackgroundAudio();
      if (elapsedTimer) {
        clearInterval(elapsedTimer);
        elapsedTimer = null;
      }
    }

    btnPlay.addEventListener("click", () => {
      if (isPlaying) pauseKaraoke();
      else startKaraoke();
    });

    btnRestart.addEventListener("click", () => {
      pauseKaraoke();
      totalSeconds = 0;
      screenTimer.textContent = "00:00";
      changeLine(0);
    });

    function applySpeedChange(newMs) {
      const clamped = Math.max(10, Math.min(5000, Math.round(newMs)));
      if (clamped === msPerWord) return;

      const oldDuration = currentLineDuration;
      msPerWord = clamped;
      updateSpeedDisplay();

      const newDuration = calculateDurationForSentence(AFFIRMATIONS[currentIndex]);
      if (isPlaying && oldDuration > 0) {
        const elapsed = performance.now() - lineStartTime;
        const progress = Math.min(elapsed / oldDuration, 1);
        currentLineDuration = newDuration;
        lineStartTime = performance.now() - (progress * newDuration);
      } else {
        currentLineDuration = newDuration;
      }
    }

    // NÚT BẤM (+) VÀ (-) TĂNG GIẢM TỐC ĐỘ THEO TỪNG TỪ
    btnSpeedUp.addEventListener("click", () => {
      const step = msPerWord < 100 ? 10 : 25;
      applySpeedChange(msPerWord + step);
    });

    btnSpeedDown.addEventListener("click", () => {
      const step = msPerWord <= 100 ? 10 : 25;
      applySpeedChange(msPerWord - step);
    });

    musicSelect.addEventListener("change", () => {
      if (isPlaying) startBackgroundAudio();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === " " || e.code === "Space") {
        e.preventDefault();
        btnPlay.click();
      } else if (e.key === "ArrowDown" || e.key === "ArrowRight") {
        if (currentIndex < AFFIRMATIONS.length - 1) changeLine(currentIndex + 1);
      } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
        if (currentIndex > 0) changeLine(currentIndex - 1);
      }
    });

    changeLine(0);
  })();
</script>
